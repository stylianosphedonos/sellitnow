<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.account">Account - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <script src="/js/i18n.js?v=20260829-i18n"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260905-navicons">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">3nityLab</a>
      <nav class="nav">
        <a href="/admin/" class="nav-link" id="adminLink" style="display:none" data-i18n="nav.manage">Manage</a>
        <button class="nav-link" id="logoutBtn" data-i18n="nav.logout">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1 data-i18n="account.title">My Account</h1>
    <div id="profile"></div>
    <h2 style="margin-top:32px" data-i18n="account.orders">Order History</h2>
    <div id="orders"></div>
  </main>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js?v=20260829-i18n"></script>
  <script>
    initLogout();

    async function initProfilePage() {
      await ensureValidSession();
      if (!getUser()) {
        window.location.href = '/login.html?redirect=' + encodeURIComponent('/profile.html');
        return;
      }
      const user = getUser();
      if (user?.role === 'admin') document.getElementById('adminLink').style.display = 'inline';
      await loadBrandSettings();
      loadProfile();
      await loadOrders();
    }

    function tr(key, vars) {
      return typeof t === 'function' ? t(key, vars) : key;
    }

    async function loadProfile() {
      try {
        const { user: profile } = await callApi('/auth/me');
        document.getElementById('profile').innerHTML = `
          <div style="background:white;padding:24px;border-radius:12px;max-width:500px;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
            <p><strong>${tr('account.name')}</strong> ${profile.first_name} ${profile.last_name}</p>
            <p><strong>${tr('account.email')}</strong> ${profile.email}</p>
            ${profile.phone ? '<p><strong>' + tr('account.phone') + '</strong> ' + profile.phone + '</p>' : ''}
          </div>
        `;
      } catch (err) {
        document.getElementById('profile').innerHTML = '<p>' + tr('account.loadFailed') + '</p>';
      }
    }

    async function loadOrders() {
      try {
        const data = await callApi('/orders');
        const items = data.items || [];
        if (items.length === 0) {
          document.getElementById('orders').innerHTML = '<p>' + tr('account.noOrders') + '</p>';
          return;
        }
        const dateLocale = typeof getStoreLang === 'function' && getStoreLang() === 'el' ? 'el-CY' : undefined;
        document.getElementById('orders').innerHTML = `
          <div class="table">
            <table style="width:100%;border-collapse:collapse">
              <tr><th>${tr('account.orderCol')}</th><th>${tr('account.statusCol')}</th><th>${tr('account.paymentCol')}</th><th>${tr('account.totalCol')}</th><th>${tr('account.dateCol')}</th></tr>
              ${items.map(o => `
                <tr>
                  <td>${o.order_number}</td>
                  <td>${o.status}</td>
                  <td>${o.payment_method === 'pay_on_delivery' ? tr('account.onDelivery', { status: o.payment_status }) : o.payment_status}</td>
                  <td>${formatStoreMoney(o.total_amount)}</td>
                  <td>${new Date(o.created_at).toLocaleDateString(dateLocale)}</td>
                </tr>
              `).join('')}
            </table>
          </div>
        `;
      } catch (err) {
        document.getElementById('orders').innerHTML = '<p>' + tr('account.ordersFailed') + '</p>';
      }
    }

    window.addEventListener('storelangchange', () => {
      if (typeof applyStaticTranslations === 'function') applyStaticTranslations();
      loadProfile();
      loadOrders();
    });

    document.addEventListener('DOMContentLoaded', initProfilePage);

    window.addEventListener('pageshow', (e) => {
      if (!e.persisted || typeof loadBrandSettings !== 'function') return;
      loadBrandSettings().then(() => loadOrders());
    });
  </script>
</body>
</html>

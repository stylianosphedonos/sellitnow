<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260828-cart">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">3nityLab</a>
      <nav class="nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/cart.html" class="nav-link cart-link">Cart <span class="cart-count" id="cartCount">0</span></a>
        <a href="/login.html" class="nav-link" id="loginBtn">Login</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="product-page__toolbar">
      <button type="button" class="btn btn-secondary product-page__back" id="productBack">← Back</button>
    </div>
    <div id="product" style="display:flex;gap:32px;max-width:900px;margin:0 auto;background:white;padding:32px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08)">
      <div class="product-image" style="width:400px;aspect-ratio:1;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:120px;color:#999" id="productImage">📦</div>
      <div style="flex:1">
        <h1 id="productTitle" style="font-size:24px;margin-bottom:12px"></h1>
        <p id="productPrice" style="font-size:28px;font-weight:700;color:var(--primary);margin-bottom:16px"></p>
        <p id="productOfferBadge" style="display:none;margin-bottom:8px"><span style="display:inline-block;background:#fef3c7;color:#92400e;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px">Special offer</span></p>
        <p id="productPriceCompare" style="display:none;font-size:16px;color:#888;text-decoration:line-through;margin:-8px 0 12px"></p>
        <p id="productDesc" style="margin-bottom:24px;line-height:1.6;color:#555"></p>
        <div id="bundleIncludes" class="bundle-includes" style="display:none">
          <h3 class="bundle-includes__heading">This offer includes</h3>
          <div id="bundleIncludesList" class="bundle-includes__grid"></div>
        </div>
        <div id="variantSection" style="display:none;margin-bottom:20px"></div>
        <div class="form-group" style="max-width:120px;margin-bottom:16px">
          <label>Quantity</label>
          <input type="number" id="qty" value="1" min="1" style="width:100%">
        </div>
        <div class="product-page__actions">
          <button class="btn" id="addToCart">Add to Cart</button>
          <button type="button" class="btn btn-secondary" id="shareProduct" aria-label="Share product link">Share</button>
        </div>
      </div>
    </div>
  </main>

  <div id="productImageLightbox" class="product-lightbox" hidden aria-hidden="true">
    <div class="product-lightbox__backdrop" data-close-lightbox></div>
    <button type="button" class="product-lightbox__close" data-close-lightbox aria-label="Close">&times;</button>
    <img id="productImageLightboxImg" class="product-lightbox__img" alt="">
  </div>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js?v=20260828-cart"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    let product;

    document.getElementById('productBack')?.addEventListener('click', () => {
      try {
        const ref = document.referrer;
        if (ref && new URL(ref).origin === location.origin) {
          history.back();
          return;
        }
      } catch (_) {}
      window.location.href = '/';
    });

    function escapeHtml(str) {
      if (str == null) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function resolveProductMediaUrl(url) {
      if (!url) return '';
      return typeof sellitnowResolveMediaUrl === 'function'
        ? sellitnowResolveMediaUrl(url)
        : url;
    }

    function renderBundleIncludeItem(item) {
      const label = escapeHtml(item.title || 'Product');
      const qtyLabel = item.quantity > 1 ? ` × ${item.quantity}` : '';
      const imgUrl = resolveProductMediaUrl(item.image_url);
      const photoInner = imgUrl
        ? `<img src="${escapeHtml(imgUrl)}" alt="${label}" loading="lazy" decoding="async">`
        : '<span class="bundle-includes__placeholder" aria-hidden="true">📦</span>';
      const body = `
        <div class="bundle-includes__photo">${photoInner}</div>
        <span class="bundle-includes__title">${label}${qtyLabel}</span>
      `;
      if (item.component_product_id) {
        return `<a href="/product.html?id=${item.component_product_id}" class="bundle-includes__item">${body}</a>`;
      }
      return `<div class="bundle-includes__item bundle-includes__item--static">${body}</div>`;
    }

    function openProductImageLightbox(src, alt) {
      const lightbox = document.getElementById('productImageLightbox');
      const img = document.getElementById('productImageLightboxImg');
      if (!lightbox || !img || !src) return;
      img.src = src;
      img.alt = alt || '';
      lightbox.hidden = false;
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('product-lightbox-open');
    }

    function closeProductImageLightbox() {
      const lightbox = document.getElementById('productImageLightbox');
      if (!lightbox) return;
      lightbox.hidden = true;
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('product-lightbox-open');
    }

    function initProductImageLightbox() {
      const lightbox = document.getElementById('productImageLightbox');
      if (!lightbox || lightbox.dataset.bound === '1') return;
      lightbox.dataset.bound = '1';
      lightbox.querySelectorAll('[data-close-lightbox]').forEach((el) => {
        el.addEventListener('click', closeProductImageLightbox);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.hidden) closeProductImageLightbox();
      });
    }

    function renderVariantSection(opts) {
      const colors = opts.colors || [];
      const sizes = opts.sizes || [];
      const wrap = document.getElementById('variantSection');
      if (!colors.length && !sizes.length) {
        wrap.style.display = 'none';
        wrap.innerHTML = '';
        return;
      }
      wrap.style.display = 'block';
      const colorOpts = colors.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      const sizeOpts = sizes.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      let html = '';
      if (colors.length) {
        html += `<div class="form-group" style="max-width:280px"><label>Color</label><select id="selColor" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px"><option value="">Select…</option>${colorOpts}</select></div>`;
      }
      if (sizes.length) {
        html += `<div class="form-group" style="max-width:280px"><label>Size</label><select id="selSize" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px"><option value="">Select…</option>${sizeOpts}</select></div>`;
      }
      wrap.innerHTML = html;
    }

    async function loadProduct() {
      if (!id) { document.getElementById('product').innerHTML = '<p>Product not found</p>'; return; }
      try {
        const data = await callApi(`/products/${id}`);
        product = data.product;
        document.getElementById('productTitle').textContent = product.title;
        document.getElementById('productPrice').textContent = formatStoreMoney(product.price);
        const isBundle = product.product_type === 'bundle';
        document.getElementById('productOfferBadge').style.display = isBundle ? 'block' : 'none';
        const compareEl = document.getElementById('productPriceCompare');
        if (isBundle && product.compare_at_price > product.price) {
          compareEl.style.display = 'block';
          compareEl.textContent = formatStoreMoney(product.compare_at_price);
        } else {
          compareEl.style.display = 'none';
        }
        document.getElementById('productDesc').textContent = product.description || 'No description.';
        const bundleWrap = document.getElementById('bundleIncludes');
        const bundleList = document.getElementById('bundleIncludesList');
        if (isBundle && Array.isArray(product.bundle_items) && product.bundle_items.length) {
          bundleWrap.style.display = 'block';
          bundleList.innerHTML = product.bundle_items.map(renderBundleIncludeItem).join('');
        } else {
          bundleWrap.style.display = 'none';
          bundleList.innerHTML = '';
        }
        renderVariantSection(isBundle ? { colors: [], sizes: [] } : (product.options || { colors: [], sizes: [] }));
        const imgWrap = document.getElementById('productImage');
        if (product.image_url) {
          const resolvedUrl = typeof sellitnowResolveMediaUrl === 'function'
            ? sellitnowResolveMediaUrl(product.image_url)
            : product.image_url;
          imgWrap.innerHTML = '';
          const el = document.createElement('img');
          el.src = resolvedUrl;
          el.alt = product.title || 'Product image';
          el.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:12px';
          imgWrap.classList.add('product-image--clickable');
          imgWrap.setAttribute('role', 'button');
          imgWrap.setAttribute('tabindex', '0');
          imgWrap.setAttribute('aria-label', 'View full size image');
          imgWrap.onclick = () => openProductImageLightbox(resolvedUrl, product.title);
          imgWrap.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openProductImageLightbox(resolvedUrl, product.title);
            }
          };
          imgWrap.appendChild(el);
        } else {
          imgWrap.classList.remove('product-image--clickable');
          imgWrap.removeAttribute('role');
          imgWrap.removeAttribute('tabindex');
          imgWrap.removeAttribute('aria-label');
          imgWrap.onclick = null;
          imgWrap.onkeydown = null;
        }
        document.getElementById('qty').removeAttribute('max');
      } catch (err) {
        document.getElementById('product').innerHTML = '<p>Failed to load product.</p>';
      }
    }

    document.getElementById('addToCart')?.addEventListener('click', async () => {
      const qty = parseInt(document.getElementById('qty').value) || 1;
      const colorEl = document.getElementById('selColor');
      const sizeEl = document.getElementById('selSize');
      const color = colorEl ? colorEl.value : '';
      const size = sizeEl ? sizeEl.value : '';
      try {
        await callApi('/cart/items', {
          method: 'POST',
          body: JSON.stringify({ product_id: product.id, quantity: qty, color, size }),
        });
        const imageUrl = product.image_url || document.querySelector('.product-image img')?.getAttribute('src') || '';
        celebrateCartAdd(document.getElementById('addToCart'), {
          title: product.title,
          imageUrl: imageUrl || null,
          quantity: qty,
        });
      } catch (err) {
        showToast(err.message, { type: 'error' });
      }
    });

    function getProductShareUrl() {
      const productId = product?.id || id;
      if (!productId) return location.href.split('#')[0];
      return `${location.origin}/product.html?id=${productId}`;
    }

    async function copyProductLink(url) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(url);
        return;
      }
      const input = document.createElement('input');
      input.value = url;
      input.setAttribute('readonly', '');
      input.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
    }

    document.getElementById('shareProduct')?.addEventListener('click', async () => {
      if (!product && !id) {
        showToast('Product not loaded yet', { type: 'error' });
        return;
      }
      const url = getProductShareUrl();
      const title = product?.title || document.title;
      if (navigator.share) {
        try {
          await navigator.share({ title, text: title, url });
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return;
        }
      }
      try {
        await copyProductLink(url);
        showToast('Link copied', { type: 'success' });
      } catch (_) {
        showToast('Could not share link', { type: 'error' });
      }
    });

    initProductImageLightbox();

    (async () => {
      await loadBrandSettings();
      await loadProduct();
      loadCartCount();
    })();

    window.addEventListener('pageshow', (e) => {
      if (!e.persisted || typeof loadBrandSettings !== 'function') return;
      loadBrandSettings().then(() => loadProduct());
    });
  </script>
</body>
</html>

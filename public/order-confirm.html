<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">3nityLab</a>
      <nav class="nav">
        <a href="/" class="nav-link">Home</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div style="max-width:500px;margin:60px auto;background:white;padding:40px;border-radius:12px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.08)">
      <h1 style="color:var(--primary);margin-bottom:16px">Order Confirmed!</h1>
      <p id="orderNumber" style="font-size:18px;font-weight:600;margin-bottom:24px"></p>
      <p id="podPaymentNote" style="display:none;color:#666;margin-bottom:16px;font-size:15px">You chose <strong>pay on delivery</strong>. Please have payment ready when your order arrives.</p>
      <p style="color:#666">Thank you for your order. You will receive a confirmation email shortly.</p>
      <a href="/" class="btn" style="display:inline-block;margin-top:24px;text-decoration:none">Continue Shopping</a>
    </div>
  </main>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const redirectStatus = params.get('redirect_status');
    const orderId = params.get('id');
    const paymentIntentId = params.get('payment_intent');
    const orderNumberEl = document.getElementById('orderNumber');

    function showOrderNumber(number, id) {
      orderNumberEl.textContent = 'Order #' + (number || id || '');
    }

    async function syncPaymentAfterRedirect() {
      if (!paymentIntentId || redirectStatus !== 'succeeded') return;
      const guestToken = orderId ? sessionStorage.getItem('guest_order_token_' + orderId) : null;
      const body = { payment_intent_id: paymentIntentId };
      if (orderId) body.order_id = orderId;
      if (guestToken) body.guest_token = guestToken;
      try {
        const result = await callApi('/payments/confirm', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        if (result.order_number || result.order_id) {
          showOrderNumber(result.order_number, result.order_id);
        }
        if (result.guest_order_token && result.order_id) {
          sessionStorage.setItem('guest_order_token_' + result.order_id, result.guest_order_token);
        }
        if (typeof loadCartCount === 'function') loadCartCount();
      } catch (err) {
        console.warn('[order-confirm] Payment sync:', err.message || err);
      }
    }

    if (redirectStatus === 'failed') {
      document.querySelector('h1').textContent = 'Payment failed';
      document.querySelector('h1').style.color = '#c00';
      orderNumberEl.textContent =
        'Your payment could not be completed. Please try again from your cart.';
      document.querySelector('.btn').href = '/cart.html';
      document.querySelector('.btn').textContent = 'Back to cart';
    } else {
      showOrderNumber(params.get('number'), orderId);
      if (params.get('payment') === 'delivery') {
        document.getElementById('podPaymentNote').style.display = 'block';
      }
      syncPaymentAfterRedirect();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page.cart">Cart - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <script src="/js/i18n.js?v=20260905-delivery"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260905-delivery">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">3nityLab</a>
      <nav class="nav">
        <a href="/cart.html" class="nav-link nav-link--icon cart-link" data-i18n-aria="nav.cart" aria-label="Cart">
          <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <a href="/login.html" class="nav-link nav-link--icon" id="loginBtn" data-i18n-aria="nav.login" aria-label="Login">
          <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c1.5-3.5 4-5 6.5-5s5 1.5 6.5 5"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="main cart-page">
    <div id="cartContent"></div>
  </main>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js?v=20260829-i18n"></script>
  <script src="/js/cart.js?v=20260905-delivery"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof updateNav === 'function') updateNav();
      if (typeof initLogout === 'function') initLogout();
    });

    window.addEventListener('pageshow', (e) => {
      if (!e.persisted || typeof loadBrandSettings !== 'function' || typeof loadCart !== 'function') return;
      loadBrandSettings().then(() => {
        loadCart();
        if (typeof loadCartCount === 'function') loadCartCount();
      });
    });
  </script>
</body>
</html>

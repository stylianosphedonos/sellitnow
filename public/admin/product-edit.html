<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/products.html">← Products</a>
      <a href="/admin/">Dashboard</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <header class="admin-page-head">
        <div class="admin-page-head__text">
          <h1>Edit Product</h1>
          <p class="admin-lead"><a href="/admin/products.html" class="admin-link">← Back to products</a></p>
        </div>
      </header>
      <div id="error" class="alert alert-error" style="display:none"></div>
      <div id="formContainer"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    if (!getToken() || getUser()?.role !== 'admin') window.location.href = '/login.html';
    const id = new URLSearchParams(location.search).get('id');
    if (!id) window.location.href = '/admin/products.html';

    let product;
    let categories = [];
    let pickableProducts = [];
    let bundleItems = [];
    let editColors = [];
    let editSizes = [];
    let removingImageIds = new Set();

    async function loadPickableProducts() {
      try {
        const data = await callApi('/admin/products?limit=500');
        pickableProducts = (data.items || []).filter((p) => p.id !== Number(id) && (p.product_type || 'simple') !== 'bundle');
      } catch (err) {
        console.warn('Could not load products for bundle picker', err);
        pickableProducts = [];
      }
    }

    async function loadCategories() {
      try {
        const res = await callApi('/admin/categories');
        categories = res.categories || [];
      } catch (err) {
        console.warn('Could not load categories', err);
      }
    }

    async function loadProduct() {
      try {
        const data = await callApi('/products/' + id);
        product = data.product;
        if (!product) throw new Error('Product not found');
        bundleItems = (product.bundle_items || []).map((item) => ({
          component_product_id: item.component_product_id,
          quantity: item.quantity || 1,
          title: item.title,
          price: item.price,
        }));
        renderForm();
      } catch (err) {
        document.getElementById('formContainer').innerHTML = '<p>Failed to load product. ' + (err.message || '') + '</p>';
      }
    }

    function renderForm() {
      const selectedCategoryIds = new Set(
        (Array.isArray(product.category_ids) ? product.category_ids : (product.category_id ? [product.category_id] : []))
          .map((x) => Number(x))
          .filter((x) => Number.isInteger(x))
      );
      const catOptions = categories.map(c =>
        `<option value="${c.id}" ${selectedCategoryIds.has(Number(c.id)) ? 'selected' : ''}>${c.name}</option>`
      ).join('');
      document.getElementById('formContainer').innerHTML = `
        <form id="editForm" style="max-width:600px;background:white;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" name="title" value="${escapeHtml(product.title || '')}" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" style="width:100%;padding:12px;border:1px solid #eee;border-radius:8px">${escapeHtml(product.description || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Order number (optional)</label>
            <input type="number" step="1" min="0" name="display_order" value="${product.display_order ?? ''}" placeholder="Lower number shows first">
          </div>
          <div class="form-group">
            <label>Price *</label>
            <input type="number" step="0.01" name="price" value="${product.price || ''}" required>
          </div>
          <div class="form-group">
            <label>Delivery cost (optional)</label>
            <input type="number" step="0.01" min="0" name="delivery_cost" placeholder="Uses store default" value="${product.delivery_cost != null && product.delivery_cost !== '' ? escapeHtml(String(product.delivery_cost)) : ''}">
            <small style="color:#666">Leave blank to use the default from <a href="/admin/settings.html">Settings</a>. If set, each unit of this product adjusts the order delivery total relative to that default.</small>
          </div>
          <div class="form-group">
            <label>Product type</label>
            <select name="product_type" id="productTypeSelect">
              <option value="simple" ${(product.product_type || 'simple') === 'simple' ? 'selected' : ''}>Single product</option>
              <option value="bundle" ${product.product_type === 'bundle' ? 'selected' : ''}>Offer (bundle)</option>
            </select>
            <small style="color:#666">Offers combine existing products at one price and appear on the storefront as a deal.</small>
          </div>
          <div id="simpleStockGroup" class="form-group">
            <label>Stock Quantity</label>
            <input type="number" name="stock_quantity" value="${product.stock_quantity ?? 0}" min="0">
          </div>
          <div id="bundleEditor" class="form-group" style="display:none;border:1px solid #eee;border-radius:8px;padding:16px;background:#fafafa">
            <label style="display:block;margin-bottom:8px">Included products</label>
            <p id="bundleStockHint" style="margin:0 0 12px;font-size:13px;color:#666"></p>
            <div id="bundleItemsList" style="margin-bottom:12px"></div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end">
              <div style="flex:1;min-width:200px">
                <label style="font-size:13px">Add product</label>
                <select id="bundleProductPicker" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px">
                  <option value="">Select a product…</option>
                </select>
              </div>
              <div style="width:100px">
                <label style="font-size:13px">Qty</label>
                <input type="number" id="bundleItemQty" min="1" value="1" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px">
              </div>
              <button type="button" class="btn" id="btnAddBundleItem" style="max-width:140px;padding:10px 12px;margin-top:0">Add to offer</button>
            </div>
            <p id="bundlePriceHint" style="margin:12px 0 0;font-size:13px;color:#666"></p>
          </div>
          <div class="form-group">
            <label>Categories</label>
            <select name="category_ids" multiple size="6">
              ${catOptions}
            </select>
            <small style="color:#666">Hold Cmd/Ctrl to select multiple categories.</small>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select name="status">
              <option value="draft" ${product.status==='draft'?'selected':''}>Draft</option>
              <option value="active" ${product.status==='active'?'selected':''}>Active</option>
              <option value="archived" ${product.status==='archived'?'selected':''}>Archived</option>
            </select>
          </div>
          <div class="form-group">
            <label>Colors (storefront)</label>
            <div id="editColorChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;min-height:28px"></div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="text" id="inputEditColor" placeholder="e.g. Navy" style="flex:1;padding:10px;border:1px solid #eee;border-radius:8px">
              <button type="button" class="btn" style="max-width:100px;padding:8px 12px" id="btnAddEditColor">Add</button>
            </div>
          </div>
          <div class="form-group">
            <label>Sizes (storefront)</label>
            <div id="editSizeChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;min-height:28px"></div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="text" id="inputEditSize" placeholder="e.g. XXL" style="flex:1;padding:10px;border:1px solid #eee;border-radius:8px">
              <button type="button" class="btn" style="max-width:100px;padding:8px 12px" id="btnAddEditSize">Add</button>
            </div>
          </div>
          <div class="form-group">
            <label>Current Images</label>
            <div id="currentImages" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
              ${(product.images || []).map(img => `
                <div style="position:relative">
                  <img src="${img.image_url}" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #eee">
                  <button
                    type="button"
                    class="btn btn-secondary remove-image-btn"
                    data-image-id="${img.id}"
                    style="position:absolute;bottom:4px;left:4px;right:4px;padding:4px 6px;font-size:12px"
                  >
                    Remove
                  </button>
                </div>
              `).join('')}
              ${!(product.images && product.images.length) ? '<span style="color:#999">No images yet</span>' : ''}
            </div>
          </div>
          <div class="form-group">
            <label>Upload New Image(s)</label>
            <input type="file" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
            <small style="color:#666">JPEG, PNG, WebP or GIF. Max 5MB each. Up to 5 images per product.</small>
          </div>
          <div style="display:flex;gap:12px;margin-top:24px">
            <button type="submit" class="btn" style="max-width:150px">Save Changes</button>
            <a href="/admin/products.html" class="btn btn-secondary" style="max-width:150px;text-align:center;text-decoration:none;display:inline-block">Cancel</a>
          </div>
        </form>
      `;

      const form = document.getElementById('editForm');
      form.addEventListener('submit', handleSubmit);

      editColors = [...(product.options?.colors || [])];
      editSizes = [...(product.options?.sizes || [])];

      function paintVariantChips() {
        const chipStyle = 'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#f5f5f5;border-radius:20px;font-size:13px';
        const cEl = document.getElementById('editColorChips');
        const sEl = document.getElementById('editSizeChips');
        cEl.innerHTML = editColors.map((x, i) =>
          `<span style="${chipStyle}">${escapeHtml(x)}<button type="button" class="variant-chip-remove" data-ctype="color" data-i="${i}" style="border:none;background:none;cursor:pointer;font-size:16px;line-height:1;padding:0 2px" aria-label="Remove">×</button></span>`
        ).join('') || '<span style="color:#999;font-size:13px">No colors yet</span>';
        sEl.innerHTML = editSizes.map((x, i) =>
          `<span style="${chipStyle}">${escapeHtml(x)}<button type="button" class="variant-chip-remove" data-ctype="size" data-i="${i}" style="border:none;background:none;cursor:pointer;font-size:16px;line-height:1;padding:0 2px" aria-label="Remove">×</button></span>`
        ).join('') || '<span style="color:#999;font-size:13px">No sizes yet</span>';
      }

      paintVariantChips();
      setupBundleEditor();

      form.addEventListener('click', (e) => {
        const rm = e.target.closest('.variant-chip-remove');
        if (!rm) return;
        const i = parseInt(rm.dataset.i, 10);
        if (rm.dataset.ctype === 'color') editColors.splice(i, 1);
        else editSizes.splice(i, 1);
        paintVariantChips();
      });

      document.getElementById('btnAddEditColor').addEventListener('click', () => {
        const v = document.getElementById('inputEditColor').value.trim();
        if (v && !editColors.includes(v)) editColors.push(v);
        document.getElementById('inputEditColor').value = '';
        paintVariantChips();
      });
      document.getElementById('btnAddEditSize').addEventListener('click', () => {
        const v = document.getElementById('inputEditSize').value.trim();
        if (v && !editSizes.includes(v)) editSizes.push(v);
        document.getElementById('inputEditSize').value = '';
        paintVariantChips();
      });

      form.addEventListener('click', async (e) => {
        const removeBtn = e.target.closest('.remove-image-btn');
        if (!removeBtn) return;

        const imageId = parseInt(removeBtn.dataset.imageId, 10);
        if (!Number.isInteger(imageId) || removingImageIds.has(imageId)) return;
        if (!confirm('Remove this image from the product?')) return;

        try {
          removingImageIds.add(imageId);
          removeBtn.disabled = true;
          removeBtn.textContent = 'Removing...';
          await removeProductImage(imageId);
          renderForm();
        } catch (err) {
          const errEl = document.getElementById('error');
          errEl.textContent = err.message || 'Failed to remove image';
          errEl.style.display = 'block';
          removeBtn.disabled = false;
          removeBtn.textContent = 'Remove';
        } finally {
          removingImageIds.delete(imageId);
        }
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function isBundleType() {
      return document.getElementById('productTypeSelect')?.value === 'bundle';
    }

    function computeBundleComparePrice() {
      return bundleItems.reduce((sum, item) => {
        const price = Number(item.price) || 0;
        const qty = Number(item.quantity) || 1;
        return sum + price * qty;
      }, 0);
    }

    function paintBundleItems() {
      const list = document.getElementById('bundleItemsList');
      if (!list) return;
      if (!bundleItems.length) {
        list.innerHTML = '<p style="margin:0;color:#999;font-size:13px">No products in this offer yet.</p>';
        return;
      }
      list.innerHTML = bundleItems.map((item, index) => `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:white;border:1px solid #eee;border-radius:8px;margin-bottom:8px">
          <div>
            <strong>${escapeHtml(item.title || 'Product #' + item.component_product_id)}</strong>
            <span style="color:#666;font-size:13px;margin-left:8px">× ${item.quantity}</span>
          </div>
          <button type="button" class="btn btn-secondary bundle-item-remove" data-index="${index}" style="padding:4px 10px;font-size:12px;margin-top:0">Remove</button>
        </div>
      `).join('');
    }

    function syncBundleUi() {
      const bundle = isBundleType();
      const editor = document.getElementById('bundleEditor');
      const stockGroup = document.getElementById('simpleStockGroup');
      const stockHint = document.getElementById('bundleStockHint');
      const priceHint = document.getElementById('bundlePriceHint');
      const picker = document.getElementById('bundleProductPicker');
      if (editor) editor.style.display = bundle ? 'block' : 'none';
      if (stockGroup) stockGroup.style.display = bundle ? 'none' : 'block';
      if (stockHint) {
        stockHint.textContent = bundle
          ? `Available offers: ${product.stock_quantity ?? 0} (based on included product stock).`
          : '';
      }
      if (priceHint) {
        const compare = computeBundleComparePrice();
        priceHint.textContent = compare > 0
          ? `Separate total: ${formatStoreMoney(compare)}. Set your offer price above.`
          : '';
      }
      if (picker) {
        const selectedIds = new Set(bundleItems.map((b) => b.component_product_id));
        picker.innerHTML = '<option value="">Select a product…</option>' + pickableProducts
          .filter((p) => !selectedIds.has(p.id))
          .map((p) => `<option value="${p.id}">${escapeHtml(p.title)} (${formatStoreMoney(p.price)})</option>`)
          .join('');
      }
      paintBundleItems();
    }

    function setupBundleEditor() {
      document.getElementById('productTypeSelect')?.addEventListener('change', syncBundleUi);
      document.getElementById('btnAddBundleItem')?.addEventListener('click', () => {
        const picker = document.getElementById('bundleProductPicker');
        const qtyInput = document.getElementById('bundleItemQty');
        const productId = parseInt(picker?.value || '', 10);
        const quantity = parseInt(qtyInput?.value || '1', 10) || 1;
        if (!Number.isInteger(productId)) {
          alert('Select a product to add.');
          return;
        }
        const picked = pickableProducts.find((p) => p.id === productId);
        if (!picked) return;
        bundleItems.push({
          component_product_id: productId,
          quantity,
          title: picked.title,
          price: picked.price,
        });
        if (picker) picker.value = '';
        if (qtyInput) qtyInput.value = '1';
        syncBundleUi();
      });
      document.getElementById('bundleItemsList')?.addEventListener('click', (e) => {
        const btn = e.target.closest('.bundle-item-remove');
        if (!btn) return;
        const index = parseInt(btn.dataset.index, 10);
        if (Number.isInteger(index)) {
          bundleItems.splice(index, 1);
          syncBundleUi();
        }
      });
      syncBundleUi();
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const selectedCategories = Array.from(form.category_ids.selectedOptions || [])
        .map((opt) => parseInt(opt.value, 10))
        .filter((x) => Number.isInteger(x));

      const rawDel = (form.delivery_cost && form.delivery_cost.value != null) ? String(form.delivery_cost.value).trim() : '';
      let delivery_cost = null;
      if (rawDel !== '') {
        delivery_cost = parseFloat(rawDel);
        if (!Number.isFinite(delivery_cost) || delivery_cost < 0) {
          errEl.textContent = 'Delivery cost must be a non-negative number.';
          errEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Changes';
          return;
        }
      }

      const productType = form.product_type?.value || 'simple';
      if (productType === 'bundle' && !bundleItems.length) {
        errEl.textContent = 'Add at least one product to this offer.';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Changes';
        return;
      }

      const productData = {
        title: form.title.value,
        description: form.description.value,
        price: parseFloat(form.price.value) || 0,
        stock_quantity: parseInt(form.stock_quantity.value, 10) || 0,
        category_ids: selectedCategories,
        status: form.status.value,
        product_type: productType,
        delivery_cost,
        display_order: form.display_order.value === '' ? null : parseInt(form.display_order.value, 10),
        options: { colors: [...editColors], sizes: [...editSizes] },
        bundle_items: bundleItems.map((item) => ({
          component_product_id: item.component_product_id,
          quantity: item.quantity,
        })),
      };

      try {
        await callApi('/admin/products/' + id, {
          method: 'PUT',
          body: JSON.stringify(productData)
        });

        const fileInput = form.images;
        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          const formData = new FormData();
          for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('images', fileInput.files[i]);
          }
          const imgRes = await sellitnowFetchWithCsrf(sellitnowApiUrl('/admin/products/' + id + '/images'), {
            method: 'POST',
            body: formData
          });
          const imgData = await imgRes.json().catch(() => ({}));
          if (!imgRes.ok) throw new Error(imgData.error || 'Failed to upload images');
        }

        window.location.href = '/admin/products.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Changes';
      }
    }

    async function removeProductImage(imageId) {
      const data = await callApi('/admin/products/' + id + '/images/' + imageId, {
        method: 'DELETE'
      });
      product = data.product;
      return data.product;
    }

    (async () => {
      await loadCategories();
      await loadPickableProducts();
      await loadProduct();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <header class="admin-page-head">
        <div class="admin-page-head__text">
          <h1>Orders</h1>
          <p class="admin-lead">Search, filter, and update order fulfillment status.</p>
        </div>
      </header>

      <div id="ordersMessage" class="admin-flash" role="status"></div>

      <div class="admin-toolbar">
        <div class="admin-toolbar__field" style="min-width:220px;max-width:300px">
          <label for="searchOrders">Search</label>
          <input type="text" id="searchOrders" placeholder="Order # or email">
        </div>
        <div class="admin-toolbar__field" style="min-width:180px;max-width:220px">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="pending,processing" selected>Pending &amp; Processing</option>
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <div class="admin-toolbar admin-toolbar--compact">
        <div class="admin-toolbar__row">
          <div class="admin-toolbar__field" style="min-width:200px;max-width:260px">
            <label for="bulkStatus">Bulk update</label>
            <select id="bulkStatus" aria-label="Bulk status">
              <option value="">Update selected to...</option>
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <button id="applyBulkStatus" class="btn btn-sm" type="button">Apply to selected</button>
        </div>
      </div>

      <div id="orders"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    if (!getToken() || getUser()?.role !== 'admin') window.location.href = '/login.html?redirect=' + encodeURIComponent('/admin/orders.html');

    function showOrdersMessage(message, isError = false) {
      const el = document.getElementById('ordersMessage');
      if (!el) return;
      el.textContent = message;
      el.className = 'admin-flash is-visible ' + (isError ? 'admin-flash--error' : 'admin-flash--success');
      if (!isError) {
        clearTimeout(window.ordersMessageTimeout);
        window.ordersMessageTimeout = setTimeout(() => {
          el.classList.remove('is-visible');
        }, 2500);
      }
    }

    function ordersListQueryString() {
      const params = new URLSearchParams();
      const search = (document.getElementById('searchOrders')?.value || '').trim();
      const status = (document.getElementById('statusFilter')?.value || '').trim();
      if (search) params.set('search', search);
      if (status) params.set('status', status);
      const q = params.toString();
      return q ? '?' + q : '';
    }

    async function loadOrders() {
      try {
        await loadBrandSettings();
        const data = await callApi('/admin/orders' + ordersListQueryString());
        const items = data.items || [];
        const badge = (s) => (typeof adminStatusBadge === 'function' ? adminStatusBadge(s) : s);
        document.getElementById('orders').innerHTML = `
          <div class="admin-table-wrap">
          <table class="table">
            <thead><tr><th><input type="checkbox" id="selectAllOrders" aria-label="Select all orders"></th><th>Order #</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>
            ${items.length ? items.map(o => `
              <tr data-order-id="${o.id}">
                <td><input type="checkbox" class="order-select" value="${o.id}" aria-label="Select order ${o.order_number}"></td>
                <td><strong>${o.order_number}</strong></td>
                <td>${o.guest_email || o.user_email || '-'}</td>
                <td>${formatStoreMoney(o.total_amount)}</td>
                <td class="order-status">${badge(o.status)}</td>
                <td>${o.payment_method === 'pay_on_delivery' ? 'On delivery' : 'Card'} · ${o.payment_status}</td>
                <td>${new Date(o.created_at).toLocaleDateString()}</td>
                <td class="col-actions"><a href="/admin/order.html?id=${o.id}" class="admin-link">View</a></td>
              </tr>
            `).join('') : '<tr><td colspan="8" class="admin-empty">No orders match your filters.</td></tr>'}
            </tbody>
          </table>
          </div>
        `;
        document.getElementById('selectAllOrders')?.addEventListener('change', (e) => {
          document.querySelectorAll('.order-select').forEach((cb) => {
            cb.checked = e.target.checked;
          });
        });
      } catch (err) {
        document.getElementById('orders').innerHTML = '<p class="admin-empty">Failed to load orders.</p>';
      }
    }

    async function applyBulkStatusUpdate() {
      const status = document.getElementById('bulkStatus')?.value;
      const selectedIds = Array.from(document.querySelectorAll('.order-select:checked')).map((cb) => Number(cb.value));
      if (!status) {
        showOrdersMessage('Please select a status first.', true);
        return;
      }
      if (!selectedIds.length) {
        showOrdersMessage('Please select at least one order.', true);
        return;
      }

      const button = document.getElementById('applyBulkStatus');
      const originalText = button?.textContent || 'Apply to selected';
      if (button) {
        button.disabled = true;
        button.textContent = 'Updating...';
      }

      try {
        const result = await callApi('/admin/orders/status/bulk', {
          method: 'PATCH',
          body: JSON.stringify({ order_ids: selectedIds, status })
        });
        const updatedOrders = result.orders || [];
        for (const order of updatedOrders) {
          const row = document.querySelector(`tr[data-order-id="${order.id}"]`);
          const cell = row?.querySelector('.order-status');
          if (cell && typeof adminStatusBadge === 'function') cell.innerHTML = adminStatusBadge(order.status);
          else cell?.replaceChildren(document.createTextNode(order.status));
        }
        showOrdersMessage(`Updated ${updatedOrders.length} order${updatedOrders.length === 1 ? '' : 's'} to "${status}".`);
        await loadOrders();
      } catch (err) {
        showOrdersMessage(err.message || 'Failed to update selected orders.', true);
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = originalText;
        }
      }
    }

    document.getElementById('searchOrders')?.addEventListener('input', () => {
      clearTimeout(window.searchTimeout);
      window.searchTimeout = setTimeout(() => loadOrders(), 300);
    });
    document.getElementById('statusFilter')?.addEventListener('change', () => loadOrders());
    document.getElementById('applyBulkStatus')?.addEventListener('click', applyBulkStatusUpdate);

    loadOrders();
  </script>
</body>
</html>

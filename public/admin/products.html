<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin - 3nitylab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <h1>Products</h1>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px">
        <button class="btn" style="max-width:150px" type="button" onclick="showProductForm('simple')">Add Product</button>
        <button class="btn btn-secondary" style="max-width:170px" type="button" onclick="showProductForm('bundle')">Create Offer</button>
        <div class="form-group" style="margin:0;min-width:220px;flex:1;max-width:420px">
          <label for="productSearchTitle" style="display:block;margin-bottom:6px;font-size:14px">Search by title</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input type="search" id="productSearchTitle" placeholder="e.g. headphones" autocomplete="off" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px">
            <button type="button" class="btn" id="productSearchBtn" style="max-width:120px;white-space:nowrap">Search</button>
          </div>
        </div>
      </div>
      <div id="productForm" style="display:none;background:white;padding:24px;border-radius:8px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
        <h3>New Product</h3>
        <form id="addProduct">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" name="title" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" style="width:100%;padding:12px;border:1px solid #eee;border-radius:8px"></textarea>
          </div>
          <div class="form-group">
            <label>Order number (optional)</label>
            <input type="number" name="display_order" step="1" min="0" placeholder="Lower number shows first">
          </div>
          <div class="form-group">
            <label>Price *</label>
            <input type="number" step="0.01" name="price" required>
          </div>
          <div class="form-group">
            <label>Delivery cost (optional)</label>
            <input type="number" step="0.01" min="0" name="delivery_cost" placeholder="Store default">
            <small style="color:#666">Override per SKU; leave blank to use Settings → default delivery.</small>
          </div>
          <div class="form-group">
            <label>Categories</label>
            <select id="createProductCategories" name="category_ids" multiple size="6"></select>
            <small style="color:#666">Hold Cmd/Ctrl to select multiple categories.</small>
          </div>
          <div class="form-group">
            <label>Product type</label>
            <select name="product_type" id="createProductType">
              <option value="simple">Single product</option>
              <option value="bundle">Offer (bundle)</option>
            </select>
          </div>
          <div id="createBundleEditor" class="form-group" style="display:none;border:1px solid #eee;border-radius:8px;padding:16px;background:#fafafa">
            <label>Included products</label>
            <div id="createBundleItemsList" style="margin:8px 0 12px"></div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end">
              <div style="flex:1;min-width:200px">
                <select id="createBundleProductPicker" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px">
                  <option value="">Select a product…</option>
                </select>
              </div>
              <div style="width:90px">
                <input type="number" id="createBundleItemQty" min="1" value="1" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px" title="Quantity">
              </div>
              <button type="button" class="btn" id="btnCreateAddBundleItem" style="max-width:130px;padding:10px;margin-top:0">Add</button>
            </div>
          </div>
          <div class="form-group" id="createStockGroup">
            <label>Stock Quantity</label>
            <input type="number" name="stock_quantity" value="0">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select name="status"><option value="draft">Draft</option><option value="active">Active</option><option value="archived">Archived</option></select>
          </div>
          <div class="form-group">
            <label>Product Image(s)</label>
            <input type="file" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
            <small style="color:#666">JPEG, PNG, WebP or GIF. Max 5MB each. Up to 5 images per product.</small>
          </div>
          <button type="submit" class="btn">Create Product</button>
        </form>
      </div>
      <div id="products"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    if (!getToken() || getUser()?.role !== 'admin') window.location.href = '/login.html?redirect=' + encodeURIComponent('/admin/products.html');
    let categories = [];
    let pickableProducts = [];
    let createBundleItems = [];

    function showProductForm(type) {
      const formWrap = document.getElementById('productForm');
      formWrap.style.display = 'block';
      const typeSelect = document.getElementById('createProductType');
      if (typeSelect) typeSelect.value = type === 'bundle' ? 'bundle' : 'simple';
      syncCreateBundleUi();
    }

    async function loadPickableProducts() {
      try {
        const data = await callApi('/admin/products?limit=500');
        pickableProducts = (data.items || []).filter((p) => (p.product_type || 'simple') !== 'bundle');
      } catch (_) {
        pickableProducts = [];
      }
    }

    function syncCreateBundleUi() {
      const isBundle = document.getElementById('createProductType')?.value === 'bundle';
      document.getElementById('createBundleEditor').style.display = isBundle ? 'block' : 'none';
      document.getElementById('createStockGroup').style.display = isBundle ? 'none' : 'block';
      const picker = document.getElementById('createBundleProductPicker');
      const selected = new Set(createBundleItems.map((b) => b.component_product_id));
      if (picker) {
        picker.innerHTML = '<option value="">Select a product…</option>' + pickableProducts
          .filter((p) => !selected.has(p.id))
          .map((p) => `<option value="${p.id}">${escapeAttr(p.title)} (${formatStoreMoney(p.price)})</option>`)
          .join('');
      }
      const list = document.getElementById('createBundleItemsList');
      if (!list) return;
      list.innerHTML = createBundleItems.length
        ? createBundleItems.map((item, index) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:white;border:1px solid #eee;border-radius:8px;margin-bottom:6px">
            <span>${escapeAttr(item.title)} × ${item.quantity}</span>
            <button type="button" class="btn btn-secondary" data-create-bundle-remove="${index}" style="padding:2px 8px;font-size:12px;margin-top:0">Remove</button>
          </div>
        `).join('')
        : '<p style="margin:0;color:#999;font-size:13px">Add products included in this offer.</p>';
    }

    async function loadCategories() {
      try {
        const data = await callApi('/categories');
        categories = data.categories || [];
      } catch (_) {
        categories = [];
      }
      const select = document.getElementById('createProductCategories');
      if (!select) return;
      select.innerHTML = categories.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function currentProductTitleQuery() {
      return (document.getElementById('productSearchTitle')?.value || '').trim();
    }

    async function loadProducts() {
      try {
        await loadBrandSettings();
        const q = currentProductTitleQuery();
        const qs = new URLSearchParams({ limit: '100', _: String(Date.now()) });
        if (q) qs.set('q', q);
        const data = await callApi('/admin/products?' + qs.toString(), { cache: 'no-store' });
        const items = data.items || [];
        const hint = q
          ? `<p style="margin:0 0 12px;font-size:14px;color:var(--text-muted)">${items.length ? `Showing ${items.length} of ${data.total} matching “${escapeAttr(q)}”.` : `No products match “${escapeAttr(q)}”.`} <button type="button" class="btn btn-secondary" style="margin-left:8px;padding:4px 10px;font-size:12px" id="productSearchClear">Clear search</button></p>`
          : '';
        document.getElementById('products').innerHTML = hint + `
          <table class="table">
            <tr><th>ID</th><th>Order</th><th>Title</th><th>Type</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>
            ${items.length ? items.map(p => `
              <tr>
                <td>${p.id}</td>
                <td>${p.display_order ?? '-'}</td>
                <td>${p.title}</td>
                <td>${p.product_type === 'bundle' ? 'Offer' : 'Product'}</td>
                <td>${formatStoreMoney(p.price)}</td>
                <td>${p.stock_quantity}</td>
                <td>${p.status}</td>
                <td style="white-space:nowrap">
                  <div style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">
                    <button type="button" class="btn" style="padding:6px 12px;font-size:12px;width:auto" onclick="editProduct(${p.id})">Edit</button>
                    <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:12px;width:auto;margin-top:0;background:#b91c1c" onclick="deleteProduct(${p.id})">Delete</button>
                  </div>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="8" style="padding:16px;color:var(--text-muted)">No products to show.</td></tr>'}
          </table>
        `;
        document.getElementById('productSearchClear')?.addEventListener('click', () => {
          const inp = document.getElementById('productSearchTitle');
          if (inp) inp.value = '';
          loadProducts();
        });
      } catch (err) {
        document.getElementById('products').innerHTML = '<p>Failed to load products. Make sure you are logged in as admin.</p>';
      }
    }

    function escapeAttr(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    document.getElementById('productSearchBtn')?.addEventListener('click', () => loadProducts());
    document.getElementById('productSearchTitle')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loadProducts();
      }
    });

    document.getElementById('addProduct')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      data.stock_quantity = parseInt(data.stock_quantity) || 0;
      const orderRaw = String(data.display_order || '').trim();
      if (orderRaw === '') data.display_order = null;
      else data.display_order = parseInt(orderRaw, 10);
      const dRaw = String(data.delivery_cost || '').trim();
      if (dRaw === '') delete data.delivery_cost;
      else data.delivery_cost = parseFloat(dRaw);
      data.category_ids = Array.from(form.category_ids.selectedOptions || [])
        .map((opt) => parseInt(opt.value, 10))
        .filter((x) => Number.isInteger(x));
      data.product_type = document.getElementById('createProductType')?.value || 'simple';
      if (data.product_type === 'bundle') {
        if (!createBundleItems.length) {
          alert('Add at least one product to this offer.');
          return;
        }
        data.bundle_items = createBundleItems.map((item) => ({
          component_product_id: item.component_product_id,
          quantity: item.quantity,
        }));
        data.stock_quantity = 0;
      }
      try {
        const created = await callApi('/admin/products', { method: 'POST', body: JSON.stringify(data) });
        const productId = created?.product?.id;
        const files = formData.getAll('images').filter((f) => f && typeof f === 'object' && f.size > 0);

        if (productId && files.length) {
          const imageData = new FormData();
          for (const file of files) imageData.append('images', file);
          const uploadRes = await sellitnowFetchWithCsrf(sellitnowApiUrl('/admin/products/' + productId + '/images'), {
            method: 'POST',
            body: imageData
          });
          const uploadJson = await uploadRes.json().catch(() => ({}));
          if (!uploadRes.ok) {
            throw new Error(uploadJson.error || 'Product created, but image upload failed.');
          }
        }

        form.reset();
        createBundleItems = [];
        syncCreateBundleUi();
        document.getElementById('productForm').style.display = 'none';
        loadProducts();
      } catch (err) {
        alert(err.message);
      }
    });

    function editProduct(id) {
      window.location.href = '/admin/product-edit.html?id=' + id;
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product? This cannot be undone.')) return;
      try {
        await callApi('/admin/products/' + id, { method: 'DELETE' });
        loadProducts();
      } catch (err) {
        alert(err.message || 'Delete failed');
      }
    }

    document.getElementById('createProductType')?.addEventListener('change', syncCreateBundleUi);
    document.getElementById('btnCreateAddBundleItem')?.addEventListener('click', () => {
      const picker = document.getElementById('createBundleProductPicker');
      const qtyInput = document.getElementById('createBundleItemQty');
      const productId = parseInt(picker?.value || '', 10);
      const quantity = parseInt(qtyInput?.value || '1', 10) || 1;
      if (!Number.isInteger(productId)) {
        alert('Select a product to add.');
        return;
      }
      const picked = pickableProducts.find((p) => p.id === productId);
      if (!picked) return;
      createBundleItems.push({
        component_product_id: productId,
        quantity,
        title: picked.title,
      });
      if (picker) picker.value = '';
      if (qtyInput) qtyInput.value = '1';
      syncCreateBundleUi();
    });
    document.getElementById('createBundleItemsList')?.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-create-bundle-remove]');
      if (!btn) return;
      const index = parseInt(btn.getAttribute('data-create-bundle-remove'), 10);
      if (Number.isInteger(index)) {
        createBundleItems.splice(index, 1);
        syncCreateBundleUi();
      }
    });

    loadPickableProducts().then(() => loadCategories().then(loadProducts));

    window.addEventListener('pageshow', (e) => {
      if (e.persisted) loadCategories().then(loadProducts);
    });
  </script>
</body>
</html>

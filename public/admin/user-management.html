<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html" class="active">User Management</a>
      <a href="/" style="margin-top:20px">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <header class="admin-page-head">
        <div class="admin-page-head__text">
          <h1>User Management</h1>
          <p class="admin-lead">Manage users who can access the admin panel.</p>
        </div>
      </header>

      <div id="alert" class="alert" style="display:none;margin-bottom:24px"></div>

      <div class="admin-stack">
        <section id="changePasswordSection" class="admin-card">
          <h2>Change my password</h2>
          <p id="changePasswordHint" style="margin:0 0 20px;color:var(--text-muted);font-size:14px"></p>
          <form id="changePasswordForm" class="admin-form-grid" style="max-width:700px">
            <div class="form-group">
              <label>New password *</label>
              <input type="password" id="newPassword" name="new_password" required minlength="8" autocomplete="new-password" placeholder="Min 8 characters">
            </div>
            <div class="form-group">
              <label>Confirm new password *</label>
              <input type="password" id="confirmPassword" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Re-enter password">
            </div>
            <div class="form-group">
              <button type="submit" class="btn">Update password</button>
            </div>
          </form>
        </section>

        <!-- Add user -->
        <section class="admin-card">
          <h2>Add Admin User</h2>
          <form id="addUserForm" class="admin-form-grid">
            <div class="form-group">
              <label>Email *</label>
              <input type="email" name="email" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
              <label>Password *</label>
              <input type="password" name="password" required minlength="8" placeholder="Min 8 characters">
            </div>
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" name="first_name" required>
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" name="last_name" required>
            </div>
            <div class="form-group">
              <button type="submit" class="btn">Create User</button>
            </div>
          </form>
        </section>

        <!-- Admin users list -->
        <section class="admin-card">
          <h2>Admin Users</h2>
          <div id="usersList"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="resetPasswordModal" class="request-modal" hidden aria-hidden="true">
    <div class="request-modal__backdrop" data-close-reset-modal></div>
    <div class="request-modal__panel" role="dialog" aria-modal="true" aria-labelledby="resetPasswordTitle">
      <button type="button" class="request-modal__close" data-close-reset-modal aria-label="Close">&times;</button>
      <h2 id="resetPasswordTitle">Reset password</h2>
      <p id="resetPasswordHint" class="request-modal__prompt"></p>
      <form id="resetPasswordForm" class="request-modal__form">
        <input type="hidden" id="resetPasswordUserId" value="">
        <div class="form-group">
          <label for="resetNewPassword">New password *</label>
          <input type="password" id="resetNewPassword" required minlength="8" autocomplete="new-password" placeholder="Min 8 characters">
        </div>
        <div class="form-group">
          <label for="resetConfirmPassword">Confirm new password *</label>
          <input type="password" id="resetConfirmPassword" required minlength="8" autocomplete="new-password" placeholder="Re-enter password">
        </div>
        <div id="resetPasswordError" class="alert alert-error" style="display:none"></div>
        <div class="request-modal__actions">
          <button type="submit" class="btn" id="resetPasswordSubmit">Reset password</button>
          <button type="button" class="btn btn-secondary" data-close-reset-modal>Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    const me = getUser();

    const alertEl = document.getElementById('alert');
    const changePasswordHint = document.getElementById('changePasswordHint');
    if (me?.email) {
      changePasswordHint.textContent = `Signed in as ${me.email}. Your session stays valid until it expires; log in again if you want a fresh token after changing password.`;
    }

    function showMsg(msg, isError) {
      alertEl.textContent = msg;
      alertEl.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
      alertEl.style.display = 'block';
      setTimeout(() => { alertEl.style.display = 'none'; }, 4000);
    }

    function escapeHtml(str) {
      if (str == null) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    function openResetPasswordModal(user) {
      const modal = document.getElementById('resetPasswordModal');
      const form = document.getElementById('resetPasswordForm');
      const errEl = document.getElementById('resetPasswordError');
      const hint = document.getElementById('resetPasswordHint');
      document.getElementById('resetPasswordUserId').value = String(user.id);
      hint.textContent = `Set a new password for ${user.email}.`;
      if (form) form.reset();
      document.getElementById('resetPasswordUserId').value = String(user.id);
      if (errEl) errEl.style.display = 'none';
      modal.hidden = false;
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('request-modal-open');
      document.getElementById('resetNewPassword')?.focus();
    }

    function closeResetPasswordModal() {
      const modal = document.getElementById('resetPasswordModal');
      if (!modal) return;
      modal.hidden = true;
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('request-modal-open');
    }

    async function loadUsers() {
      try {
        const data = await callApi('/admin/users');
        const users = data.users || [];
        document.getElementById('usersList').innerHTML = users.length
          ? `
            <div class="admin-table-wrap">
            <table class="table">
              <thead><tr><th>Email</th><th>Name</th><th>Created</th><th></th></tr></thead>
              <tbody>
              ${users.map(u => `
                <tr>
                  <td>${escapeHtml(u.email)}</td>
                  <td>${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</td>
                  <td>${new Date(u.created_at).toLocaleDateString()}</td>
                  <td style="text-align:right;white-space:nowrap">
                    <button type="button" class="btn btn-secondary" data-reset-user-id="${u.id}" data-reset-user-email="${escapeHtml(u.email)}" style="padding:8px 12px;font-size:13px">Reset password</button>
                  </td>
                </tr>
              `).join('')}
              </tbody>
            </table>
            </div>
          `
          : '<p class="admin-empty">No admin users yet.</p>';

        document.querySelectorAll('[data-reset-user-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            openResetPasswordModal({
              id: Number(btn.getAttribute('data-reset-user-id')),
              email: btn.getAttribute('data-reset-user-email') || 'this user',
            });
          });
        });
      } catch (err) {
        document.getElementById('usersList').innerHTML = '<p>Failed to load users.</p>';
      }
    }

    document.querySelectorAll('[data-close-reset-modal]').forEach((el) => {
      el.addEventListener('click', closeResetPasswordModal);
    });

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = Number(document.getElementById('resetPasswordUserId').value);
      const newPwd = document.getElementById('resetNewPassword').value;
      const confirm = document.getElementById('resetConfirmPassword').value;
      const errEl = document.getElementById('resetPasswordError');
      const submitBtn = document.getElementById('resetPasswordSubmit');
      if (!Number.isInteger(userId) || userId <= 0) {
        errEl.textContent = 'Invalid user.';
        errEl.style.display = 'block';
        return;
      }
      if (newPwd !== confirm) {
        errEl.textContent = 'New password and confirmation do not match.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';
      try {
        await callApi(`/admin/users/${userId}/reset-password`, {
          method: 'POST',
          body: JSON.stringify({ new_password: newPwd }),
        });
        closeResetPasswordModal();
        showMsg('Password reset successfully.');
      } catch (err) {
        errEl.textContent = err.message || 'Failed to reset password.';
        errEl.style.display = 'block';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset password';
    });

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let uid = getUser()?.id ?? me?.id;
      if (!uid && getToken()) {
        try {
          const { user } = await callApi('/auth/me');
          if (user?.id) {
            uid = user.id;
            setUser({ ...getUser(), ...user });
          }
        } catch (_) {}
      }
      if (!uid) {
        showMsg('Could not determine your user id. Please log out and log in again.', true);
        return;
      }
      const newPwd = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (newPwd !== confirm) {
        showMsg('New password and confirmation do not match.', true);
        return;
      }
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      try {
        await callApi(`/admin/users/${uid}/reset-password`, {
          method: 'POST',
          body: JSON.stringify({ new_password: newPwd })
        });
        form.reset();
        showMsg('Password updated successfully.');
      } catch (err) {
        showMsg(err.message || 'Failed to update password.', true);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    });

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';
      try {
        const data = Object.fromEntries(new FormData(form));
        await callApi('/admin/users', {
          method: 'POST',
          body: JSON.stringify(data)
        });
        form.reset();
        showMsg('Admin user created. They can now log in with the admin panel.');
        loadUsers();
      } catch (err) {
        showMsg(err.message || 'Failed to create user.', true);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create User';
    });

    loadUsers();
  </script>
</body>
</html>

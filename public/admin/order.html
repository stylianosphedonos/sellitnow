<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/orders.html">← Orders</a>
      <a href="/admin/">Dashboard</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
    </aside>
    <main class="admin-content">
      <h1>Order <span id="orderNumber"></span></h1>
      <div id="statusMessage" class="order-page-banner" style="display:none" role="status"></div>
      <div id="order"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (!id) window.location.href = '/admin/orders.html';
    let currentOrder = null;
    let emailLogs = [];

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function showBanner(message, isError = false, hideAfterMs = 0) {
      const el = document.getElementById('statusMessage');
      if (!el) return;
      el.textContent = message;
      el.style.display = 'block';
      el.className = 'order-page-banner ' + (isError ? 'order-page-banner--error' : 'order-page-banner--success');
      clearTimeout(window.orderBannerTimeout);
      if (!isError && hideAfterMs > 0) {
        window.orderBannerTimeout = setTimeout(() => {
          el.style.display = 'none';
        }, hideAfterMs);
      }
    }

    function formatLogTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
    }

    function sourceLabel(source) {
      const map = {
        payment_webhook: 'Stripe payment',
        admin_manual: 'Admin (manual send)',
        admin_status_save: 'Admin (save & email)',
        order_created: 'Order placed',
        auto_expiry: 'Auto (unpaid timeout)',
        automatic: 'Automatic',
      };
      return map[source] || source || '';
    }

    function renderEmailLogs(logs) {
      emailLogs = Array.isArray(logs) ? logs : [];
      const list = document.getElementById('emailActivityList');
      if (!list) return;
      if (!emailLogs.length) {
        list.innerHTML =
          '<li class="order-activity-item order-activity-item--idle">No emails logged for this order yet.</li>';
        return;
      }
      list.innerHTML = emailLogs
        .map((e) => {
          const ok = Boolean(e.success);
          const detail = ok
            ? `Sent to ${e.recipient_to || '—'}`
            : e.error_message || 'Send failed';
          const subject = e.subject ? ` · ${e.subject}` : '';
          const via = e.source ? ` · ${sourceLabel(e.source)}` : '';
          return `<li class="order-activity-item order-activity-item--${ok ? 'ok' : 'err'}">
              <span class="order-activity-item__time">${esc(formatLogTime(e.created_at))}</span>
              <strong>${esc(e.label || e.email_type || 'Email')}</strong>${esc(subject)}${esc(via)}
              <span class="order-activity-item__detail">${esc(detail)}</span>
            </li>`;
        })
        .join('');
    }

    function setEmailPanelState(state, message) {
      const panel = document.getElementById('orderEmailPanel');
      const result = document.getElementById('emailActionResult');
      const text = document.getElementById('emailActionResultText');
      if (!text) return;
      const states = ['is-sending', 'is-success', 'is-error', 'is-idle'];
      if (panel) panel.classList.remove(...states.filter((s) => s !== 'is-idle'));
      if (result) result.classList.remove(...states.filter((s) => s !== 'is-idle'));
      if (state && state !== 'idle') {
        if (panel) panel.classList.add('is-' + state);
        if (result) result.classList.add('is-' + state);
      }
      text.textContent = message;
      result?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function getFulfillmentFields() {
      return {
        status: document.getElementById('orderStatusSelect')?.value,
        tracking_number: document.getElementById('trackingNumberInput')?.value?.trim() || '',
      };
    }

    async function loadEmailPreview() {
      const previewSubject = document.getElementById('emailPreviewSubject');
      const previewBody = document.getElementById('emailPreviewBody');
      const previewLabel = document.getElementById('emailPreviewLabel');
      const type = document.querySelector('input[name="emailType"]:checked')?.value || 'payment_receipt';
      const { status, tracking_number } = getFulfillmentFields();
      if (!previewSubject || !previewBody) return;

      previewSubject.textContent = 'Loading preview…';
      previewBody.textContent = '';

      try {
        const q = new URLSearchParams({ type });
        if (type === 'status_update') {
          q.set('status', status || '');
          q.set('tracking_number', tracking_number);
        }
        const data = await callApi('/admin/orders/' + id + '/email/preview?' + q.toString());
        previewLabel.textContent = data.label || 'Email preview';
        previewSubject.textContent = data.subject || '—';
        previewBody.textContent = data.text || '—';
        const receiptBtn = document.getElementById('sendReceiptBtn');
        if (receiptBtn) {
          receiptBtn.textContent =
            data.payment_status === 'paid' ? 'Send payment receipt' : 'Send order confirmation';
        }
      } catch (err) {
        previewSubject.textContent = 'Preview unavailable';
        previewBody.textContent = err.message || 'Could not load preview.';
      }
    }

    async function sendCustomerEmail(type) {
      const clickedAt = new Date().toLocaleTimeString();
      const sendBtn =
        type === 'status_update'
          ? document.getElementById('sendStatusEmailBtn')
          : type === 'payment_reminder'
            ? document.getElementById('sendPaymentReminderBtn')
            : document.getElementById('sendReceiptBtn');
      const label =
        type === 'status_update'
          ? 'Status update'
          : type === 'payment_reminder'
            ? 'Payment reminder'
            : document.getElementById('sendReceiptBtn')?.textContent || 'Receipt';

      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.dataset.prevText = sendBtn.textContent;
        sendBtn.textContent = 'Sending…';
      }

      setEmailPanelState('sending', `Clicked at ${clickedAt} — sending ${label.toLowerCase()}…`);

      try {
        const { status, tracking_number } = getFulfillmentFields();
        const body = { type };
        if (type === 'status_update') {
          body.status = status;
          body.tracking_number = tracking_number;
        }
        const res = await callApi('/admin/orders/' + id + '/email/send', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        const doneAt = new Date().toLocaleTimeString();
        setEmailPanelState('success', `✓ ${res.message || 'Email sent.'} (${doneAt})`);
        showBanner(res.message || 'Email sent successfully.', false, 10000);
        if (res.email_logs) renderEmailLogs(res.email_logs);
        if (sendBtn) sendBtn.textContent = 'Sent ✓';
      } catch (err) {
        const doneAt = new Date().toLocaleTimeString();
        const errMsg = err.message || 'Could not send email.';
        if (err.data?.email_logs) renderEmailLogs(err.data.email_logs);
        setEmailPanelState('error', `✗ Failed at ${doneAt}. ${errMsg}`);
        showBanner(errMsg, true, 0);
        if (sendBtn && sendBtn.dataset.prevText) sendBtn.textContent = sendBtn.dataset.prevText;
      } finally {
        if (sendBtn) sendBtn.disabled = false;
      }
    }

    function updatePaymentStatusBadge(paymentStatus) {
      const badge = document.getElementById('paymentStatusBadge');
      if (!badge) return;
      badge.textContent = paymentStatus;
      badge.className = 'order-badge order-badge--' + paymentStatus;
    }

    async function updatePaymentStatus() {
      const select = document.getElementById('paymentStatusSelect');
      const btn = document.getElementById('savePaymentStatusBtn');
      if (!select || !btn) return;
      const nextStatus = select.value;
      const prevStatus = currentOrder?.payment_status;
      if (nextStatus === prevStatus) {
        showBanner('Payment status is already "' + nextStatus + '".', false, 3000);
        return;
      }

      btn.disabled = true;
      const prevLabel = btn.textContent;
      btn.textContent = 'Saving…';
      try {
        const res = await callApi('/admin/orders/' + id + '/payment-status', {
          method: 'PATCH',
          body: JSON.stringify({ payment_status: nextStatus }),
        });
        const prevFulfillmentStatus = currentOrder?.status;
        currentOrder = { ...currentOrder, ...res.order };
        updatePaymentStatusBadge(res.order.payment_status);
        document.getElementById('currentPaymentStatus').textContent = res.order.payment_status;
        const fulfillmentStatus = document.getElementById('currentOrderStatus');
        if (fulfillmentStatus && res.order.status !== prevFulfillmentStatus) {
          fulfillmentStatus.textContent = res.order.status;
        }
        const orderStatusSelect = document.getElementById('orderStatusSelect');
        if (orderStatusSelect && orderStatusSelect.value !== res.order.status) {
          orderStatusSelect.value = res.order.status;
        }
        showBanner(
          `Payment status updated from "${res.previousPaymentStatus}" to "${res.order.payment_status}".`,
          false,
          5000
        );
        await loadEmailPreview();
      } catch (err) {
        showBanner(err.message || 'Failed to update payment status.', true, 0);
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel;
      }
    }

    function bindOrderPageHandlers() {
      document.getElementById('savePaymentStatusBtn')?.addEventListener('click', updatePaymentStatus);
      document.querySelectorAll('input[name="emailType"]').forEach((el) => {
        el.addEventListener('change', () => loadEmailPreview());
      });
      document.getElementById('orderStatusSelect')?.addEventListener('change', () => {
        const type = document.querySelector('input[name="emailType"]:checked')?.value;
        if (type === 'status_update') loadEmailPreview();
      });
      document.getElementById('trackingNumberInput')?.addEventListener('input', () => {
        const type = document.querySelector('input[name="emailType"]:checked')?.value;
        if (type === 'status_update') {
          clearTimeout(window.previewDebounce);
          window.previewDebounce = setTimeout(loadEmailPreview, 400);
        }
      });
      document.getElementById('refreshPreviewBtn')?.addEventListener('click', () => loadEmailPreview());
      document.getElementById('sendReceiptBtn')?.addEventListener('click', () =>
        sendCustomerEmail('payment_receipt')
      );
      document.getElementById('sendStatusEmailBtn')?.addEventListener('click', () =>
        sendCustomerEmail('status_update')
      );
      document.getElementById('sendPaymentReminderBtn')?.addEventListener('click', () =>
        sendCustomerEmail('payment_reminder')
      );

      document.getElementById('saveStatusBtn')?.addEventListener('click', () => updateOrderStatus(false));
      document.getElementById('saveAndEmailBtn')?.addEventListener('click', () => updateOrderStatus(true));
    }

    async function updateOrderStatus(sendEmail) {
      const form = document.getElementById('statusForm');
      const btn = sendEmail
        ? document.getElementById('saveAndEmailBtn')
        : document.getElementById('saveStatusBtn');
      if (!form || !btn) return;
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = sendEmail ? 'Saving & sending…' : 'Saving…';
      try {
        const res = await callApi('/admin/orders/' + id + '/status', {
          method: 'PATCH',
          body: JSON.stringify({
            status: form.status.value,
            tracking_number: form.tracking_number.value || undefined,
            send_customer_email: sendEmail,
          }),
        });
        currentOrder = res.order;
        document.getElementById('currentOrderStatus').textContent = res.order.status;
        document.getElementById('currentPaymentStatus').textContent = res.order.payment_status;

        let msg = `Order status updated to "${res.order.status}".`;
        if (res.customerEmailSent) {
          msg += ' Customer was emailed.';
        } else if (sendEmail && res.customerEmailError) {
          msg += ' Email failed: ' + res.customerEmailError;
        }
        if (res.email_logs) renderEmailLogs(res.email_logs);
        showBanner(msg, Boolean(sendEmail && res.customerEmailError), sendEmail ? 10000 : 5000);
        if (sendEmail) await loadEmailPreview();
      } catch (err) {
        showBanner(err.message || 'Failed to update order.', true, 0);
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    async function loadOrder() {
      try {
        await loadBrandSettings();
        const { order } = await callApi('/admin/orders/' + id);
        currentOrder = order;
        document.getElementById('orderNumber').textContent = order.order_number;
        const addr =
          typeof order.shipping_address === 'string'
            ? JSON.parse(order.shipping_address)
            : order.shipping_address;
        const customerEmail = order.guest_email || order.user_email || '';
        const showPaymentReminder =
          order.payment_status === 'pending' && order.payment_method !== 'pay_on_delivery';
        const unpaidNotice =
          showPaymentReminder && order.status !== 'cancelled'
            ? '<p class="order-email-warning" style="margin-top:0">Unpaid card orders are automatically cancelled after 3 days if payment is not received.</p>'
            : '';
        const stockAlert = order.stock_warning
          ? `<div class="alert alert-warning order-stock-alert" role="status"><strong>Stock:</strong> ${esc(order.stock_warning)}</div>`
          : '';

        document.getElementById('order').innerHTML = `
          ${stockAlert}
          <div class="order-admin-summary">
            <div class="order-admin-card">
              <h3>Customer</h3>
              <p class="order-admin-card__primary">${esc(customerEmail || '—')}</p>
              <p class="order-admin-card__muted">${esc(order.first_name || '')} ${esc(order.last_name || '')}</p>
            </div>
            <div class="order-admin-card">
              <h3>Shipping</h3>
              <p>${esc(addr?.address_line1 || '—')}<br>${esc([addr?.city, addr?.postal_code].filter(Boolean).join(' '))} ${esc(addr?.country || '')}</p>
              ${addr?.phone ? `<p class="order-admin-card__muted" style="margin-top:10px"><strong>Phone</strong> ${esc(addr.phone)}</p>` : ''}
            </div>
            <div class="order-admin-card">
              <h3>Payment</h3>
              <p><span id="paymentStatusBadge" class="order-badge order-badge--${esc(order.payment_status)}">${esc(order.payment_status)}</span></p>
              <p class="order-admin-card__muted">${order.payment_method === 'pay_on_delivery' ? 'Pay on delivery' : 'Card online'}</p>
              <p class="order-admin-card__primary" style="margin-top:8px">${formatStoreMoney(order.total_amount)}</p>
              <form id="paymentStatusForm" class="order-payment-form" style="margin-top:14px">
                <div class="form-group" style="margin-bottom:10px">
                  <label for="paymentStatusSelect" style="font-size:13px">Payment status</label>
                  <select id="paymentStatusSelect" class="order-input">
                    <option value="pending" ${order.payment_status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="paid" ${order.payment_status === 'paid' ? 'selected' : ''}>Paid</option>
                    <option value="failed" ${order.payment_status === 'failed' ? 'selected' : ''}>Failed</option>
                    <option value="refunded" ${order.payment_status === 'refunded' ? 'selected' : ''}>Refunded</option>
                  </select>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" id="savePaymentStatusBtn">Update payment status</button>
              </form>
            </div>
            <div class="order-admin-card">
              <h3>Fulfillment</h3>
              <p><span class="order-badge">${esc(order.status)}</span></p>
              ${order.tracking_number ? `<p class="order-admin-card__muted" style="margin-top:8px">Tracking: ${esc(order.tracking_number)}</p>` : ''}
            </div>
          </div>

          <section class="order-section">
            <h2 class="order-section__title">Line items</h2>
            <table class="table">
              <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
              <tbody>
                ${(order.items || [])
                  .map((i) => {
                    const snap =
                      typeof i.product_snapshot === 'string'
                        ? JSON.parse(i.product_snapshot)
                        : i.product_snapshot;
                    const v = [snap?.color, snap?.size].filter(Boolean).join(' · ');
                    const vCell = v ? `<br><span class="order-admin-card__muted">${esc(v)}</span>` : '';
                    return `<tr><td>${esc(snap?.title || '-')}${vCell}</td><td>${i.quantity}</td><td>${formatStoreMoney(i.unit_price)}</td><td>${formatStoreMoney(i.total_price)}</td></tr>`;
                  })
                  .join('')}
              </tbody>
            </table>
            <p class="order-section__total">Order total: <strong>${formatStoreMoney(order.total_amount)}</strong></p>
          </section>

          <div class="order-workspace">
            <section class="order-panel">
              <h2 class="order-panel__title">Fulfillment</h2>
              <p class="order-panel__intro">Update order status and tracking. Save only, or save and email the customer in one step.</p>
              <form id="statusForm" class="order-fulfillment-form">
                <div class="form-group">
                  <label for="orderStatusSelect">Order status</label>
                  <select name="status" id="orderStatusSelect" class="order-input">
                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                    <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="trackingNumberInput">Tracking number</label>
                  <input type="text" name="tracking_number" id="trackingNumberInput" class="order-input" placeholder="Optional" value="${esc(order.tracking_number || '')}">
                </div>
                <p class="order-admin-card__muted">Current: <span id="currentOrderStatus">${esc(order.status)}</span> · Payment: <span id="currentPaymentStatus">${esc(order.payment_status)}</span></p>
                <div class="order-panel__actions">
                  <button type="button" class="btn btn-secondary" id="saveStatusBtn">Save status only</button>
                  <button type="button" class="btn" id="saveAndEmailBtn">Save &amp; email customer</button>
                </div>
              </form>
            </section>

            <section id="orderEmailPanel" class="order-panel order-panel--email">
              <h2 class="order-panel__title">Customer email</h2>
              <p class="order-panel__intro">Preview and send emails anytime. Configure SMTP in <a href="/admin/settings.html">Settings</a>.</p>
              ${unpaidNotice}
              <p class="order-email-recipient"><strong>To:</strong> ${esc(customerEmail || '—')}</p>
              ${!customerEmail ? '<p class="order-email-warning">No customer email on this order — emails cannot be sent.</p>' : ''}

              <fieldset class="order-email-type" ${!customerEmail ? 'disabled' : ''}>
                <legend class="order-email-type__legend">Email type</legend>
                <label class="order-email-type__option">
                  <input type="radio" name="emailType" value="payment_receipt" checked>
                  <span>Payment receipt / order confirmation</span>
                </label>
                ${
                  showPaymentReminder
                    ? `<label class="order-email-type__option">
                  <input type="radio" name="emailType" value="payment_reminder">
                  <span>Payment reminder (unpaid order)</span>
                </label>`
                    : ''
                }
                <label class="order-email-type__option">
                  <input type="radio" name="emailType" value="status_update">
                  <span>Status update (uses status &amp; tracking above)</span>
                </label>
              </fieldset>

              <div class="order-email-preview">
                <div class="order-email-preview__head">
                  <span id="emailPreviewLabel" class="order-email-preview__label">Email preview</span>
                  <button type="button" class="btn btn-secondary btn-sm" id="refreshPreviewBtn">Refresh preview</button>
                </div>
                <p class="order-preview-row"><strong>Subject</strong></p>
                <p id="emailPreviewSubject" class="order-preview-box">—</p>
                <p class="order-preview-row"><strong>Message (plain text)</strong></p>
                <pre id="emailPreviewBody" class="order-preview-box order-preview-box--pre">—</pre>
              </div>

              <div class="order-panel__actions">
                <button type="button" class="btn" id="sendReceiptBtn" ${!customerEmail ? 'disabled' : ''}>Send payment receipt</button>
                ${
                  showPaymentReminder
                    ? `<button type="button" class="btn btn-secondary" id="sendPaymentReminderBtn" ${!customerEmail ? 'disabled' : ''}>Send payment reminder</button>`
                    : ''
                }
                <button type="button" class="btn btn-secondary" id="sendStatusEmailBtn" ${!customerEmail ? 'disabled' : ''}>Send status email only</button>
              </div>

              <div id="emailActionResult" class="order-email-result" role="status" aria-live="assertive">
                <p class="order-email-result__label">Last action</p>
                <p id="emailActionResultText" class="order-email-result__text">Ready — choose an email type, preview, then click send.</p>
              </div>

              <div class="order-activity">
                <h3 class="order-activity__title">Email history</h3>
                <ul id="emailActivityList" class="order-activity__list">
                  <li class="order-activity-item order-activity-item--idle">Loading…</li>
                </ul>
              </div>
            </section>
          </div>

          <div class="order-panel__actions" style="margin-top:8px">
            <button type="button" class="btn btn-secondary" onclick="downloadInvoice()">Download invoice PDF</button>
          </div>
        `;

        bindOrderPageHandlers();
        renderEmailLogs(order.email_logs);
        await loadEmailPreview();
      } catch (err) {
        document.getElementById('order').innerHTML =
          '<p class="order-email-warning">Failed to load order.</p>';
      }
    }

    async function downloadInvoice() {
      const res = await sellitnowFetchWithAuth(sellitnowApiUrl('/admin/orders/' + id + '/invoice'));
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'invoice-' + document.getElementById('orderNumber').textContent + '.pdf';
      a.click();
    }

    loadOrder();
  </script>
</body>
</html>

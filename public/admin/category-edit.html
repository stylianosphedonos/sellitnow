<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Category - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/categories.html">← Categories</a>
      <a href="/admin/">Dashboard</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <h1>Edit Category</h1>
      <div id="error" class="alert alert-error" style="display:none"></div>
      <div id="formContainer"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    if (!getToken() || getUser()?.role !== 'admin') window.location.href = '/login.html';
    const id = new URLSearchParams(location.search).get('id');
    if (!id) window.location.href = '/admin/categories.html';
    const categoryId = parseInt(id, 10);
    if (!Number.isFinite(categoryId) || categoryId < 1) window.location.href = '/admin/categories.html';

    let category;
    let removingCategoryImage = false;

    async function loadCategory() {
      try {
        const data = await callApi('/categories/' + categoryId);
        category = data.category;
        if (!category) throw new Error('Category not found');
        renderForm();
      } catch (err) {
        document.getElementById('formContainer').innerHTML = '<p>Failed to load category. ' + (err.message || '') + '</p>';
      }
    }

    function optionSelected(value, current) {
      return value === current ? ' selected' : '';
    }

    function renderForm() {
      const layout = category.website_layout || 'tile';
      document.getElementById('formContainer').innerHTML = `
        <form id="editForm" style="max-width:600px;background:white;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06)">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" value="${escapeHtml(category.name || '')}" required>
          </div>
          <div class="form-group">
            <label>Slug</label>
            <input type="text" name="slug" value="${escapeHtml(category.slug || '')}" placeholder="URL segment; leave as-is or change manually">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" style="width:100%;padding:12px;border:1px solid #eee;border-radius:8px">${escapeHtml(category.description || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Position on website (sort order)</label>
            <input type="number" name="display_order" step="1" min="0" value="${category.display_order ?? ''}" placeholder="e.g. 1, 2, 3 — lower appears first">
            <small>Controls left-to-right order in “Shop by Category”. Leave empty to sort by ID.</small>
          </div>
          <div class="form-group">
            <label>Layout on website</label>
            <select name="website_layout">
              <option value="tile"${optionSelected('tile', layout)}>Grid tile</option>
              <option value="banner-left"${optionSelected('banner-left', layout)}>Banner — left side (full width)</option>
              <option value="banner-right"${optionSelected('banner-right', layout)}>Banner — right side (full width)</option>
            </select>
            <small>Moves the whole category icon: grid cell, or a full-width banner on the left or right.</small>
          </div>
          <div class="form-group">
            <label>Icon size on website</label>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <div style="flex:1;min-width:120px">
                <label for="icon_width_px" style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:4px">Width (px)</label>
                <input type="number" id="icon_width_px" name="icon_width_px" step="1" min="48" max="1200" value="${category.icon_width_px ?? ''}" placeholder="Auto (full width)">
              </div>
              <span style="color:#999;padding-top:18px" aria-hidden="true">×</span>
              <div style="flex:1;min-width:120px">
                <label for="icon_height_px" style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:4px">Height (px)</label>
                <input type="number" id="icon_height_px" name="icon_height_px" step="1" min="48" max="600" value="${category.icon_height_px ?? category.icon_size_px ?? ''}" placeholder="Default: 140">
              </div>
            </div>
            <small>Leave width empty to span the full tile or banner. The image stretches to fill the exact width and height you set.</small>
            <div id="categorySizePreview" style="margin-top:12px;padding:16px;background:#f9f9f9;border-radius:8px;border:1px solid #eee">
              <div style="font-size:12px;color:#666;margin-bottom:8px">Website preview</div>
              <div id="categoryImagePreview"></div>
            </div>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" name="show_on_website" value="1" ${category.show_on_website ? 'checked' : ''}>
              Show on website
            </label>
            <small>When checked, this category appears in “Shop by Category” on your store.</small>
          </div>
          <div class="form-group">
            <label>Current image</label>
            <div id="categoryCurrentImage" style="margin-bottom:12px">
              ${category.image_url
                ? `<div style="position:relative;display:inline-block">
                    <button
                      type="button"
                      class="btn btn-secondary remove-category-image-btn"
                      style="margin-top:8px;padding:4px 10px;font-size:12px"
                    >
                      Remove image
                    </button>
                  </div>`
                : '<span style="color:#999">No image yet — upload below to see it in the preview above</span>'}
            </div>
          </div>
          <div class="form-group">
            <label>Upload new image</label>
            <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
            <small style="color:#666">JPEG, PNG, WebP or GIF. Max 5MB each. Replaces the category image.</small>
          </div>
          <div style="display:flex;gap:12px;margin-top:24px">
            <button type="submit" class="btn" style="max-width:150px">Save Changes</button>
            <a href="/admin/categories.html" class="btn btn-secondary" style="max-width:150px;text-align:center;text-decoration:none;display:inline-block">Cancel</a>
          </div>
        </form>
      `;
      const form = document.getElementById('editForm');
      form.addEventListener('submit', handleSubmit);
      bindCategorySizePreview(form);
      form.addEventListener('click', async (e) => {
        const removeBtn = e.target.closest('.remove-category-image-btn');
        if (!removeBtn) return;
        if (removingCategoryImage) return;
        if (!confirm('Remove this category image?')) return;
        const errEl = document.getElementById('error');
        errEl.style.display = 'none';
        try {
          removingCategoryImage = true;
          removeBtn.disabled = true;
          removeBtn.textContent = 'Removing...';
          const data = await callApi('/admin/categories/' + categoryId + '/image', { method: 'DELETE' });
          category = data.category;
          renderForm();
        } catch (err) {
          errEl.textContent = err.message || 'Failed to remove image';
          errEl.style.display = 'block';
          removeBtn.disabled = false;
          removeBtn.textContent = 'Remove';
        } finally {
          removingCategoryImage = false;
        }
      });
    }

    function getPreviewCategoryFromForm(form) {
      const widthVal = form.icon_width_px.value.trim();
      const heightVal = form.icon_height_px.value.trim();
      return {
        ...category,
        name: form.name.value.trim() || category.name,
        website_layout: form.website_layout.value,
        icon_width_px: widthVal === '' ? null : parseInt(widthVal, 10),
        icon_height_px: heightVal === '' ? null : parseInt(heightVal, 10),
      };
    }

    function updateCategorySizePreview(form) {
      const previewEl = document.getElementById('categoryImagePreview');
      if (!previewEl) return;
      const previewCategory = getPreviewCategoryFromForm(form);
      const layout = getCategoryWebsiteLayout(previewCategory);
      const isBanner = layout === 'banner-left' || layout === 'banner-right';
      const wrapStyle = isBanner ? 'max-width:100%' : 'max-width:320px';
      previewEl.innerHTML = `<div class="category-grid" style="${wrapStyle};grid-template-columns:1fr">${renderStorefrontCategoryCard(previewCategory)}</div>`;
    }

    function bindCategorySizePreview(form) {
      ['icon_width_px', 'icon_height_px', 'website_layout', 'name'].forEach((name) => {
        const el = form[name];
        if (!el) return;
        el.addEventListener('input', () => updateCategorySizePreview(form));
        el.addEventListener('change', () => updateCategorySizePreview(form));
      });
      form.querySelector('input[name="image"]')?.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          category = { ...category, image_url: reader.result };
          updateCategorySizePreview(form);
        };
        reader.readAsDataURL(file);
      });
      updateCategorySizePreview(form);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const slugTrim = form.slug.value.trim();
      const payload = {
        name: form.name.value.trim(),
        description: form.description.value.trim() === '' ? null : form.description.value,
        display_order: form.display_order.value === '' ? null : parseInt(form.display_order.value, 10),
        show_on_website: form.show_on_website.checked,
        website_layout: form.website_layout.value
      };
      payload.icon_width_px = form.icon_width_px.value === '' ? null : parseInt(form.icon_width_px.value, 10);
      payload.icon_height_px = form.icon_height_px.value === '' ? null : parseInt(form.icon_height_px.value, 10);
      if (slugTrim) payload.slug = slugTrim;

      try {
        await callApi('/admin/categories/' + categoryId, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });

        const fileInput = form.querySelector('input[name="image"]');
        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          const formData = new FormData();
          formData.append('image', fileInput.files[0]);
          const imgRes = await sellitnowFetchWithCsrf(sellitnowApiUrl('/admin/categories/' + categoryId + '/image'), {
            method: 'POST',
            body: formData
          });
          const imgData = await imgRes.json().catch(() => ({}));
          if (!imgRes.ok) throw new Error(imgData.error || 'Failed to upload image');
        }

        window.location.href = '/admin/categories.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Changes';
      }
    }

    loadCategory();
  </script>
</body>
</html>

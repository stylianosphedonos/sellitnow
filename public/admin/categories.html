<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <header class="admin-page-head">
        <div class="admin-page-head__text">
          <h1>Categories</h1>
          <p class="admin-lead">Organize products for browsing on your storefront.</p>
        </div>
        <div class="admin-page-head__actions">
          <button class="btn" type="button" onclick="document.getElementById('categoryForm').classList.add('is-open')">Add Category</button>
        </div>
      </header>
      <div id="categoryForm" class="admin-panel">
        <h3>New Category</h3>
        <form id="addCategory">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required>
          </div>
          <div class="form-group">
            <label>Slug</label>
            <input type="text" name="slug" placeholder="Optional; auto-generated from name if empty">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Order number (optional)</label>
            <input type="number" name="display_order" step="1" min="0" placeholder="Lower number shows first">
          </div>
          <div class="form-group">
            <label>Category image</label>
            <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
            <small>JPEG, PNG, WebP or GIF. Max 5MB.</small>
          </div>
          <button type="submit" class="btn">Create Category</button>
        </form>
      </div>
      <div id="categories"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    if (!getToken() || getUser()?.role !== 'admin') window.location.href = '/login.html?redirect=' + encodeURIComponent('/admin/categories.html');

    function escapeAttr(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function loadCategories() {
      try {
        const { categories } = await callApi('/categories?_=' + Date.now(), { cache: 'no-store' });
        document.getElementById('categories').innerHTML = `
          <div class="admin-table-wrap">
          <table class="table">
            <thead><tr><th>ID</th><th>Order</th><th>Name</th><th>Slug</th><th>Description</th><th>Actions</th></tr></thead>
            <tbody>
            ${(categories || []).map(c => `
              <tr>
                <td>${c.id}</td>
                <td>${c.display_order ?? '-'}</td>
                <td><strong>${escapeAttr(c.name)}</strong></td>
                <td>${escapeAttr(c.slug)}</td>
                <td>${escapeAttr((c.description || '').slice(0, 50))}</td>
                <td class="col-actions">
                  <button class="btn btn-sm" type="button" onclick="editCategory(${c.id})">Edit</button>
                </td>
              </tr>
            `).join('')}
            </tbody>
          </table>
          </div>
        `;
      } catch (err) {
        document.getElementById('categories').innerHTML = '<p class="admin-empty">Failed to load categories. Make sure you are logged in as admin.</p>';
      }
    }

    document.getElementById('addCategory')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const slugTrim = form.slug.value.trim();
      const descTrim = form.description.value.trim();
      const payload = {
        name,
        description: descTrim === '' ? null : form.description.value,
        display_order: form.display_order.value === '' ? null : parseInt(form.display_order.value, 10)
      };
      if (slugTrim) payload.slug = slugTrim;
      const fileInput = form.querySelector('input[name="image"]');
      try {
        const { category } = await callApi('/admin/categories', { method: 'POST', body: JSON.stringify(payload) });
        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          const formData = new FormData();
          formData.append('image', fileInput.files[0]);
          const imgRes = await sellitnowFetchWithCsrf(sellitnowApiUrl('/admin/categories/' + category.id + '/image'), {
            method: 'POST',
            body: formData
          });
          const imgData = await imgRes.json().catch(() => ({}));
          if (!imgRes.ok) throw new Error(imgData.error || 'Failed to upload image');
        }
        form.reset();
        document.getElementById('categoryForm').classList.remove('is-open');
        loadCategories();
      } catch (err) {
        alert(err.message);
      }
    });

    function editCategory(id) {
      window.location.href = '/admin/category-edit.html?id=' + id;
    }

    loadCategories();

    window.addEventListener('pageshow', (e) => {
      if (e.persisted) loadCategories();
    });
  </script>
</body>
</html>

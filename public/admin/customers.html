<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <header class="admin-page-head">
        <div class="admin-page-head__text">
          <h1>Customers</h1>
          <p class="admin-lead">Registered accounts and contact details.</p>
        </div>
      </header>
      <div class="admin-toolbar">
        <div class="admin-toolbar__field admin-toolbar__field--grow" style="max-width:360px">
          <label for="searchCustomers">Search</label>
          <input type="text" id="searchCustomers" placeholder="Name or email">
        </div>
      </div>
      <div id="customers"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>

    function escapeAttr(s) {
      const el = document.createElement('div');
      el.textContent = s ?? '';
      return el.innerHTML;
    }

    async function loadCustomers(search = '') {
      try {
        const data = await callApi('/admin/customers?search=' + encodeURIComponent(search));
        const items = data.items || [];
        document.getElementById('customers').innerHTML = `
          <div class="admin-table-wrap">
          <table class="table">
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th></tr></thead>
            <tbody>
            ${items.length ? items.map(c => `
              <tr>
                <td>${c.id}</td>
                <td><strong>${escapeAttr(c.first_name)} ${escapeAttr(c.last_name)}</strong></td>
                <td>${escapeAttr(c.email)}</td>
                <td>${escapeAttr(c.phone || '-')}</td>
                <td>${new Date(c.created_at).toLocaleDateString()}</td>
              </tr>
            `).join('') : '<tr><td colspan="5" class="admin-empty">No customers found.</td></tr>'}
            </tbody>
          </table>
          </div>
        `;
      } catch (err) {
        document.getElementById('customers').innerHTML = '<p class="admin-empty">Failed to load customers.</p>';
      }
    }

    document.getElementById('searchCustomers')?.addEventListener('input', (e) => {
      clearTimeout(window.searchTimeout);
      window.searchTimeout = setTimeout(() => loadCustomers(e.target.value), 300);
    });

    loadCustomers();
  </script>
</body>
</html>

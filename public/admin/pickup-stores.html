<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickup stores - Admin - 3nityLab</title>
  <script src="/js/brand-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/">Dashboard</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/categories.html">Categories</a>
      <a href="/admin/orders.html">Orders</a>
      <a href="/admin/pickup-stores.html">Pickup stores</a>
      <a href="/admin/customers.html">Customers</a>
      <a href="/admin/brand.html">Brand</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/user-management.html">User Management</a>
      <a href="/">← Back to Store</a>
    </aside>
    <main class="admin-content">
      <header class="admin-page-head">
        <div class="admin-page-head__text">
          <h1>Pickup stores</h1>
          <p class="admin-lead">Cyprus pickup points from ACS, Akis Express, and Box Now. Checkout is pickup-only.</p>
        </div>
        <button type="button" class="btn" id="syncStoresBtn">Sync courier locations</button>
      </header>

      <div id="storesMessage" class="admin-flash" role="status"></div>
      <p id="acsStatus" class="admin-lead" style="margin-top:0"></p>
      <div id="countsRow" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px"></div>

      <div class="admin-toolbar">
        <div class="admin-toolbar__field" style="min-width:180px;max-width:220px">
          <label for="providerFilter">Provider</label>
          <select id="providerFilter">
            <option value="all">All</option>
            <option value="acs">ACS</option>
            <option value="akis">Akis Express</option>
            <option value="boxnow">Box Now</option>
            <option value="manual">Manual</option>
          </select>
        </div>
      </div>

      <div id="storesList"></div>
    </main>
  </div>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    function showMessage(message, isError = false) {
      const el = document.getElementById('storesMessage');
      el.textContent = message;
      el.className = 'admin-flash' + (isError ? ' admin-flash--error' : '');
      el.style.display = message ? 'block' : 'none';
    }

    function esc(s) {
      return escapeHtml(String(s == null ? '' : s));
    }

    function renderCounts(counts) {
      const host = document.getElementById('countsRow');
      const labels = { acs: 'ACS', akis: 'Akis Express', boxnow: 'Box Now', manual: 'Manual' };
      host.innerHTML = Object.keys(labels)
        .map((key) => {
          const c = counts?.[key] || { active: 0, total: 0 };
          return `<div class="admin-panel" style="padding:12px 16px;min-width:140px"><strong>${labels[key]}</strong><div style="font-size:13px;color:var(--text-muted);margin-top:4px">${c.active} active / ${c.total} total</div></div>`;
        })
        .join('');
    }

    async function loadStores() {
      const host = document.getElementById('storesList');
      const provider = document.getElementById('providerFilter').value;
      try {
        const qs = provider && provider !== 'all' ? '?provider=' + encodeURIComponent(provider) : '';
        const data = await callApi('/admin/pickup-stores' + qs);
        renderCounts(data.counts || {});
        document.getElementById('acsStatus').textContent = data.acs_configured
          ? 'ACS credentials are configured — Sync will pull Cyprus ACS stores / Shop-in-a-Shop / SmartPoint lockers.'
          : 'ACS needs ACS_COMPANY_ID, ACS_COMPANY_PASSWORD, ACS_USER_ID, ACS_USER_PASSWORD, and ACS_API_KEY (AcsApiKey header). The PDF documents demo company/user = demo, but the API key is issued privately by ACS. Box Now and Akis Express sync without ACS.';

        const stores = data.stores || [];
        if (!stores.length) {
          host.innerHTML = '<p style="color:var(--text-muted)">No pickup stores yet. Click “Sync courier locations”.</p>';
          return;
        }
        host.innerHTML = `
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Provider</th>
                  <th>Name</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${stores
                  .map(
                    (s) => `
                  <tr data-id="${s.id}">
                    <td>${esc(s.provider_label || s.provider)}</td>
                    <td>
                      <strong>${esc(s.name)}</strong>
                      <div style="font-size:12px;color:var(--text-muted)">${esc(s.code)}</div>
                    </td>
                    <td>${esc(s.address_line1)}<br>${esc(s.city)} ${esc(s.postal_code)}</td>
                    <td>${s.active ? '<span class="badge badge--active">Active</span>' : '<span class="badge">Inactive</span>'}</td>
                    <td>
                      <button type="button" class="btn btn-sm" data-toggle="${s.id}">${s.active ? 'Deactivate' : 'Activate'}</button>
                    </td>
                  </tr>`
                  )
                  .join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        host.innerHTML = '';
        showMessage(err.message || 'Failed to load stores', true);
      }
    }

    document.getElementById('providerFilter').addEventListener('change', loadStores);

    document.getElementById('syncStoresBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncStoresBtn');
      btn.disabled = true;
      btn.textContent = 'Syncing…';
      showMessage('');
      try {
        const data = await callApi('/admin/pickup-stores/sync', { method: 'POST', body: '{}' });
        const lines = Object.values(data.results || {}).map((r) => {
          if (r.skipped) return `${r.provider}: skipped (needs credentials)`;
          if (!r.ok) return `${r.provider}: ${r.error || 'failed'}`;
          return `${r.provider}: ${r.active} active`;
        });
        showMessage('Sync complete — ' + lines.join('; '));
        await loadStores();
      } catch (err) {
        showMessage(err.message || 'Sync failed', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sync courier locations';
      }
    });

    document.getElementById('storesList').addEventListener('click', async (e) => {
      const toggleId = e.target.getAttribute('data-toggle');
      if (!toggleId) return;
      try {
        const provider = document.getElementById('providerFilter').value;
        const qs = provider && provider !== 'all' ? '?provider=' + encodeURIComponent(provider) : '';
        const { stores } = await callApi('/admin/pickup-stores' + qs);
        const store = stores.find((s) => String(s.id) === String(toggleId));
        if (!store) return;
        await callApi('/admin/pickup-stores/' + toggleId, {
          method: 'PUT',
          body: JSON.stringify({ ...store, active: !store.active }),
        });
        await loadStores();
      } catch (err) {
        showMessage(err.message || 'Update failed', true);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadStores();
    });
  </script>
</body>
</html>
